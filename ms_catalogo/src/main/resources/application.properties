# Puerto del microservicio
server.port=8088

# Nombre de la aplicación
spring.application.name=ms_catalogo

# ==========================================
# CONEXIÓN A BD (Preparado para Docker)
# ==========================================
# DB_HOST será 'localhost' en tu PC, pero en Docker será el nombre del contenedor MySQL (ej: 'mysql_db')
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/smartlogix_catalogo?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.web.error.include-message=always

