# ==========================================
# 1. CONFIGURACIÓN DEL SERVIDOR
# ==========================================
server.port=8083
spring.application.name=ms-mensajeria

# ==========================================
# 2. CONFIGURACIÓN DE BASE DE DATOS (Preparado para Docker)
# ==========================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/smartlogix_mensajeria?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# 3. CONFIGURACIÓN DE RABBITMQ (Preparado para Docker)
# ==========================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}

# ==========================================
# 4. CONFIGURACIÓN DE CORREO (SMTP Gmail)
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# En local usará el texto en duro, en Docker inyectaremos las credenciales por seguridad
spring.mail.username=${MAIL_USER:mensajeria.smartlogix@gmail.com}
spring.mail.password=${MAIL_PASS:zvps zmyl yyjk exwo}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


